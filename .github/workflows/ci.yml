name: Substrata CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    name: Guardrail Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run guardrail lint
        run: python3 .guardrails/guardrail_lint.py
  
